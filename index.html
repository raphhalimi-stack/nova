<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NOVA — Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fd:Sora,Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--acc:#35e8ff;--bg:#05060a;--fg:#f4f7ff;--mut:rgba(244,247,255,.62);--glass:rgba(16,20,32,.55);--line:rgba(255,255,255,.12);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
body.tv .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(14,18,30,.9)}

/* ---------- fond ---------- */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg-art{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transform:scale(1.06);transition:opacity .8s ease,transform 8s ease-out}
.bg-art.in{opacity:1;transform:scale(1)}
.bg-art.out{opacity:0;transition:opacity .8s ease}
.bg-art.sysbg{background:radial-gradient(1200px 700px at 70% 20%,#1d2b55 0,transparent 60%),radial-gradient(900px 600px at 10% 90%,#2a1450 0,transparent 60%),#05060c}
.bg-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,4,10,.92) 0%,rgba(3,4,10,.55) 45%,rgba(3,4,10,.1) 75%),linear-gradient(0deg,rgba(3,4,10,.95) 0%,rgba(3,4,10,0) 45%),linear-gradient(180deg,rgba(3,4,10,.7) 0%,rgba(3,4,10,0) 25%)}
.aurora{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent) 0,transparent 65%);opacity:.35;animation:float 18s ease-in-out infinite alternate;mix-blend-mode:screen;pointer-events:none}
.aurora.a1{left:-20vmax;top:-30vmax}.aurora.a2{right:-25vmax;bottom:-35vmax;animation-duration:24s;opacity:.25}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#121a33 0,#05060a 60%);transition:opacity .8s ease,transform .8s ease;cursor:pointer}
#splash.gone{opacity:0;transform:scale(1.08);pointer-events:none}
.logo{font-family:var(--fd);font-weight:800;letter-spacing:.42em;font-size:clamp(48px,11vw,130px);padding-left:.42em;background:linear-gradient(100deg,#fff 0%,#fff 40%,var(--acc) 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-20% 0}}
.logo-sub{margin-top:10px;font-family:var(--fd);letter-spacing:.5em;font-size:12px;color:var(--mut);padding-left:.5em}
.press{margin-top:9vh;font-size:15px;color:var(--fg);opacity:.85;animation:blink 1.8s ease-in-out infinite;display:flex;gap:10px;align-items:center}
@keyframes blink{50%{opacity:.35}}
.ring-logo{position:absolute;width:min(60vw,520px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 120px color-mix(in srgb,var(--acc) 20%,transparent) inset;animation:spin 30s linear infinite}
.ring-logo::after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px dashed rgba(255,255,255,.08)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- app ---------- */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding:calc(18px + var(--safe-t)) calc(clamp(18px,4vw,64px) + var(--safe-r)) calc(16px + var(--safe-b)) calc(clamp(18px,4vw,64px) + var(--safe-l))}
.top{display:flex;align-items:center;gap:18px;height:48px;flex:none}
.brand{font-family:var(--fd);font-weight:800;letter-spacing:.32em;font-size:20px;display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 14px var(--acc);transform:rotate(45deg);transition:background .5s,box-shadow .5s}
.tabs{display:flex;gap:22px;margin-left:24px;font-family:var(--fd);font-weight:600;font-size:15px;color:var(--mut)}
.tabs span.on{color:var(--fg);position:relative}.tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:2px;background:var(--fg);border-radius:2px}
.status{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mut)}
.st-pad{display:flex;align-items:center;gap:6px;color:var(--fg)}.st-pad svg{width:22px;height:14px;color:var(--acc)}
.st-cloud.on{color:#7dffb0}.st-cloud.error,.st-cloud.readonly{color:#ffb36b}
.clock{font-family:var(--fd);font-weight:600;font-size:17px;color:var(--fg)}
.profile{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;background:conic-gradient(from 200deg,var(--acc),#7a5cff,#ff4fd8,var(--acc));color:#05060a;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.st-name{color:var(--fg);font-weight:600}

.rail{margin-top:clamp(14px,3.2vh,34px);display:flex;align-items:flex-end;gap:clamp(10px,1.2vw,16px);overflow-x:auto;overflow-y:visible;padding:14px 6px 34px;scrollbar-width:none;flex:none;scroll-padding:0 40%}
.rail::-webkit-scrollbar{display:none}
.rail-sep{width:1px;height:70px;background:var(--line);margin:0 8px;flex:none;align-self:center}
.tile{position:relative;flex:none;width:clamp(78px,8.6vw,124px);aspect-ratio:1;border-radius:clamp(14px,1.5vw,22px);background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,width .25s,opacity .25s;outline:none;overflow:visible}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55));pointer-events:none}
.tile-logo{position:absolute;left:8px;right:8px;bottom:10px;font-family:var(--fd);font-weight:800;font-size:clamp(9px,.95vw,13px);letter-spacing:.12em;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.tile em{position:absolute;top:7px;right:7px;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);padding:2px 6px;border-radius:20px}
.tile-name{position:absolute;left:0;top:calc(100% + 10px);white-space:nowrap;font-family:var(--fd);font-weight:600;font-size:14px;opacity:0;transform:translateY(-4px);transition:.25s}
.tile.sys{background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center}
.tile-ico svg{width:44%;height:auto;display:block;margin:auto;opacity:.9}.tile.sys .tile-ico{width:100%;display:grid;place-items:center}
.tile.focus{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 0 34px color-mix(in srgb,var(--acc) 55%,transparent),0 18px 40px rgba(0,0,0,.6);z-index:2;margin:0 8px}
.tile.focus .tile-name{opacity:1;transform:none}
.tile:not(.sys) .tile-name{display:none}
.tile.focus.dim{box-shadow:0 0 0 2px rgba(255,255,255,.4),0 18px 40px rgba(0,0,0,.6)}
.tile.soon:not(.focus){filter:saturate(.7) brightness(.85)}

.hero{margin-top:auto;max-width:min(760px,62vw);padding-bottom:2vh}
.hero.in>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.hero.in>*:nth-child(2){animation-delay:.04s}.hero.in>*:nth-child(3){animation-delay:.08s}.hero.in>*:nth-child(4){animation-delay:.12s}.hero.in>*:nth-child(5){animation-delay:.16s}.hero.in>*:nth-child(6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hero-kicker{font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.28em;color:var(--acc)}
.hero-title{font-family:var(--fd);font-weight:800;font-size:clamp(44px,7.4vw,108px);line-height:.95;letter-spacing:.04em;margin:8px 0 4px;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--acc) 45%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(0,0,0,.5))}
.hero-title.sys{font-size:clamp(34px,5vw,72px)}
.hero-sub{font-family:var(--fd);font-weight:300;font-size:clamp(16px,1.8vw,24px);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.hero-desc{margin-top:14px;font-size:clamp(14px,1.15vw,17px);line-height:1.55;color:rgba(244,247,255,.8);max-width:620px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-chips span{font-size:12px;font-weight:600;padding:6px 11px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.hero-chips span.dev{background:transparent;border-color:transparent;color:var(--mut);font-weight:500}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.hbtn{display:flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:30px;font-weight:700;font-size:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);transition:transform .18s,background .18s,box-shadow .18s}
.hbtn i{font-style:normal;font-size:13px}
.hbtn.primary{background:#fff;color:#05060a;border-color:#fff;min-width:170px;justify-content:center}
.hbtn.danger{color:#ff8a9a}
.hbtn.disabled{opacity:.45}
.hbtn.focus{transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 0 30px color-mix(in srgb,var(--acc) 60%,transparent)}
.hbtn.primary.focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 80%,#fff),0 0 34px color-mix(in srgb,var(--acc) 70%,transparent)}
@media (hover:hover){.hbtn:hover{background:rgba(255,255,255,.18)}.hbtn.primary:hover{background:#fff}}
.hero-progress{margin-top:18px;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--mut)}
.pbar{width:180px;height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.cards{display:flex;gap:12px;margin-top:2.4vh;overflow-x:auto;scrollbar-width:none;padding:6px 4px 4px;flex:none;min-height:8px}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:clamp(170px,15vw,220px);padding:14px 16px;border-radius:18px;transition:transform .2s,box-shadow .2s}
.card-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card-v{font-family:var(--fd);font-weight:700;font-size:17px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-s{font-size:12px;color:var(--mut);margin-top:3px}
.card-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}.card-bar i{display:block;height:100%;background:var(--acc)}
.card.focus{transform:translateY(-4px) scale(1.04);box-shadow:0 0 0 3px #fff,0 0 26px color-mix(in srgb,var(--acc) 50%,transparent)}
.hints{position:fixed;right:calc(clamp(18px,4vw,64px) + var(--safe-r));bottom:calc(16px + var(--safe-b));font-size:13px;color:var(--mut);z-index:2;display:flex;align-items:center;gap:6px}
.notifs{position:fixed;top:calc(78px + var(--safe-t));right:calc(clamp(18px,4vw,64px) + var(--safe-r));z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.notif{padding:12px 16px;border-radius:16px;min-width:240px;display:flex;flex-direction:column;gap:2px;animation:slideIn .4s cubic-bezier(.2,.8,.2,1);border-left:3px solid var(--acc)}
.notif b{font-family:var(--fd);font-size:14px}.notif span{font-size:12px;color:var(--mut)}
.notif.out{opacity:0;transform:translateX(30px);transition:.5s}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}}

/* glyphes boutons */
.g{display:inline-flex;align-items:center;justify-content:center;font-style:normal;min-width:22px;height:22px;padding:0 5px;border-radius:12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;vertical-align:middle;line-height:1}
.g-x{color:#9cc4ff}.g-o{color:#ff8a8a}.g-s{color:#ff9ce0}.g-t{color:#7dffc8}.g-r{font-size:10px;border-radius:6px}.g-k{border-radius:6px;font-size:11px;font-family:Inter}

/* ---------- modales & panneaux ---------- */
.modal-back,.panel-back{position:fixed;inset:0;z-index:80;background:rgba(2,3,8,.6);display:grid;place-items:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(480px,92vw);border-radius:24px;padding:26px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(760px,94vw);max-height:88vh;overflow:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal h3{font-family:var(--fd);font-size:22px;margin-bottom:10px}
.modal p{color:rgba(244,247,255,.8);line-height:1.5;font-size:14px;margin-bottom:8px}
.modal .small{font-size:12px;color:var(--mut)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn{height:44px;padding:0 20px;border-radius:24px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line);transition:.15s}
.btn.primary{background:#fff;color:#05060a}.btn.danger{background:#ff3a5c;color:#fff;border-color:#ff3a5c}
.btn.focus{box-shadow:0 0 0 3px var(--acc);transform:scale(1.04)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:180px;overflow:auto;user-select:text;-webkit-user-select:text;margin:10px 0}
.modal-input{width:100%;height:120px;margin-top:10px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px;font-family:ui-monospace,monospace;font-size:12px;resize:none;user-select:text;-webkit-user-select:text}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.ctrl-grid h4{font-family:var(--fd);margin-bottom:8px;color:var(--acc)}
.ctrl-grid ul{list-style:none;font-size:13px;line-height:1.9;color:rgba(244,247,255,.85)}
.panel{width:min(620px,94vw);max-height:88vh;border-radius:26px;padding:24px;display:flex;flex-direction:column}
.panel h2,.gmenu h2{font-family:var(--fd);font-size:26px;margin:4px 0 14px}
.gm-kicker{font-family:var(--fd);font-size:11px;letter-spacing:.28em;color:var(--acc);font-weight:600}
.gm-list{overflow:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;padding:3px}
.gm-foot{margin-top:14px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lm-row{display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid transparent;transition:.15s;cursor:pointer}
.lm-row.focus{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 25%,transparent)}
.lm-row.disabled{opacity:.5}
.lm-row.exit .lm-label{color:#ffb3c0}.lm-row.warn .lm-label{color:#ffd23d}
.lm-main{flex:1;min-width:0}
.lm-label{font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.lm-sub{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.5}
.lm-val{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.lm-arrow{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);font-size:18px;line-height:1}
.pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.swatch,.dotc{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:0 0 10px currentColor}
.dotc{width:10px;height:10px}
.eq{color:var(--acc)}

/* ---------- chargement ---------- */
#loading{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#04050a;opacity:0;pointer-events:none;transition:opacity .35s}
#loading.show{opacity:1;pointer-events:auto}
.ld-title{font-family:var(--fd);font-weight:800;font-size:clamp(34px,6vw,72px);letter-spacing:.1em}
.ld-spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);animation:spin 0.9s linear infinite}
.ld-tip{max-width:520px;text-align:center;color:var(--mut);font-size:14px;padding:0 20px}

/* ---------- jeu ---------- */
#game{position:fixed;inset:0;z-index:40;display:none;background:#000;touch-action:none}
#game.on{display:block}
body.ingame #app,body.ingame #bg,body.ingame .hints{visibility:hidden}
.game-canvas{position:absolute;inset:0;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;font-family:Inter,sans-serif;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hud-tl{position:absolute;left:calc(18px + var(--safe-l));top:calc(16px + var(--safe-t));display:flex;align-items:center;gap:10px}
.hud-lvl{position:relative;width:46px;height:46px}.hud-lvl svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:rgba(0,0,0,.45);stroke:rgba(255,255,255,.18);stroke-width:3}.ring-fg{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-dasharray:119.4;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--acc))}
.hud-lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:16px}
.hud-bars{display:flex;flex-direction:column;gap:6px}
.hud-bars .hp{width:clamp(140px,18vw,240px);height:10px;border-radius:6px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);overflow:hidden}
.hud-bars .hp i{display:block;height:100%;background:linear-gradient(90deg,#3dff9a,#a6ff6b);transition:width .2s}
.hud-bars .hp.low i{background:linear-gradient(90deg,#ff3048,#ff8a3d);animation:blink .6s infinite}
.hud-bars .xp{width:clamp(100px,12vw,160px);height:4px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}.hud-bars .xp i{display:block;height:100%;background:var(--acc)}
.hud-tr{position:absolute;right:calc(18px + var(--safe-r));top:calc(16px + var(--safe-t));display:flex;gap:8px}
.chip{padding:6px 12px;border-radius:20px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-weight:600;font-size:13px}
.chip.cr b{color:#ffd23d}.chip.sh b{color:#7ff6ff}
.hud-obj{position:absolute;left:calc(18px + var(--safe-l));top:calc(76px + var(--safe-t));max-width:min(380px,42vw);padding:10px 14px;border-left:3px solid var(--acc);background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
.hud-obj .t{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--acc);text-transform:uppercase}
.hud-obj .d{font-size:14px;margin-top:3px;line-height:1.4}.hud-obj .dist{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}
.hud-timer{position:absolute;left:50%;top:calc(16px + var(--safe-t));transform:translateX(-50%);font-family:var(--fd);font-weight:700;font-size:20px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.5);display:none;white-space:nowrap}
.hud-timer.urgent{color:#ff6070}.hud-timer .red{color:#ff6070;font-size:13px;letter-spacing:.08em}
.hud-map{position:absolute;left:calc(18px + var(--safe-l));bottom:calc(18px + var(--safe-b));width:clamp(120px,15vw,190px);height:clamp(120px,15vw,190px);border-radius:50%;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.reticle{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:.12s}
.reticle i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
.reticle.on{border-color:var(--acc);box-shadow:0 0 12px var(--acc);transform:scale(1.15)}
.reticle.swing{opacity:.3}
.lock{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;display:none;border:2px solid #ff4a5a;border-radius:8px;opacity:.8;box-shadow:0 0 10px #ff4a5a}
.wp-marker{position:absolute;left:0;top:0;display:none;margin:-14px 0 0 -14px}
.wp-marker i{display:block;width:28px;height:28px;background:var(--acc);transform:rotate(45deg) scale(.7);border:3px solid #fff;box-shadow:0 0 16px var(--acc)}
.wp-marker span{position:absolute;left:50%;top:32px;transform:translateX(-50%);font-weight:700;font-size:12px;white-space:nowrap}
.prompt{position:absolute;left:50%;bottom:calc(22% + var(--safe-b));transform:translate(-50%,10px);padding:10px 18px;border-radius:24px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);font-weight:600;font-size:15px;opacity:0;transition:.2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
.prompt.show{opacity:1;transform:translate(-50%,0)}
.toasts{position:absolute;right:calc(18px + var(--safe-r));top:calc(64px + var(--safe-t));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:10px 16px;border-radius:14px;background:rgba(8,10,18,.78);border-left:3px solid var(--c,#35e8ff);display:flex;flex-direction:column;min-width:200px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
.toast b{font-family:var(--fd);font-size:14px}.toast span{font-size:12px;color:rgba(255,255,255,.75)}
.toast.out{opacity:0;transform:translateX(20px);transition:.4s}
.toast.cyan{--c:#35e8ff}.toast.red{--c:#ff3048}.toast.yellow{--c:#ffd23d}.toast.green{--c:#3dff9a}.toast.violet{--c:#a65bff}
.iris{position:absolute;left:50%;bottom:calc(16px + var(--safe-b));transform:translate(-50%,20px);width:min(640px,64vw);display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;background:rgba(6,8,16,.82);border:1px solid rgba(255,255,255,.12);opacity:0;transition:.3s}
.iris.show{opacity:1;transform:translate(-50%,0)}
.iris-av{flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#a65bff,#35e8ff);display:flex;align-items:center;justify-content:center;gap:3px}
.iris-av span{width:3px;height:14px;background:#fff;border-radius:2px;animation:wave .8s ease-in-out infinite}.iris-av span:nth-child(2){animation-delay:.15s}.iris-av span:nth-child(3){animation-delay:.3s}
@keyframes wave{50%{transform:scaleY(.35)}}
.iris-txt b{font-family:var(--fd);font-size:11px;letter-spacing:.2em;color:#c9a6ff}.iris-txt p{font-size:14px;line-height:1.45;margin-top:2px}
.combo{position:absolute;right:calc(14% + var(--safe-r));top:40%;text-align:center;opacity:0}
.combo b{display:block;font-family:var(--fd);font-weight:800;font-size:44px;color:#fff;text-shadow:0 0 18px var(--acc)}.combo span{font-size:11px;letter-spacing:.3em;font-weight:700}
.combo.show{animation:comboA 1.1s ease-out forwards}
@keyframes comboA{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.center-msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;opacity:0;pointer-events:none}
.center-msg b{display:block;white-space:nowrap;font-family:var(--fd);font-weight:800;font-size:clamp(26px,4.4vw,56px);letter-spacing:.08em;text-shadow:0 0 30px var(--acc)}
.center-msg span{font-size:16px;color:rgba(255,255,255,.85)}
.center-msg.show{animation:cmsg .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cmsg{from{opacity:0;transform:translate(-50%,-50%) scale(1.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.boss-bar{position:absolute;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);width:min(560px,60vw);display:none;text-align:center}
.boss-bar.show{display:block}
.boss-bar span{font-family:var(--fd);font-weight:800;letter-spacing:.3em;font-size:13px;color:#ff6070}
.boss-bar div{height:10px;margin-top:6px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,96,112,.5);overflow:hidden}.boss-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3048,#ff8a3d);transition:width .2s}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,40,.55));opacity:0}
.vig.hit{animation:vig .5s ease-out}
@keyframes vig{0%{opacity:1}100%{opacity:0}}
.cr-pop{position:absolute;right:calc(18px + var(--safe-r));top:calc(48px + var(--safe-t));font-weight:800;color:#ffd23d;opacity:0}
.cr-pop.show{animation:crp 1.2s ease-out}
@keyframes crp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.fps{position:absolute;right:8px;bottom:8px;font-size:11px;color:#9f9;display:none}
.rotate-hint{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:14px;background:rgba(0,0,0,.7);font-size:14px;text-align:center;width:80%}
#game.portrait .rotate-hint{display:block;animation:fadeaway 4s forwards}
@keyframes fadeaway{80%{opacity:1}100%{opacity:0}}

/* menus en jeu */
.gmenu{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,3,8,.55);animation:fade .2s;pointer-events:auto}
.gmenu-panel{width:min(640px,94vw);max-height:90vh;border-radius:26px;padding:24px;display:flex;flex-direction:column}
.gm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gm-stats{display:flex;gap:12px;font-size:13px;color:var(--mut);margin-bottom:16px}.gm-stats b{color:#fff}
.map-wrap{display:flex;gap:20px;padding:18px;border-radius:26px;width:min(1180px,96vw);height:min(760px,92vh)}
.bigmap{height:100%;aspect-ratio:1;border-radius:18px;max-width:58%;object-fit:contain}
.map-side{flex:1;display:flex;flex-direction:column;min-width:0}

/* tactile */
.touch{position:absolute;inset:0;pointer-events:none}
.t-look{position:absolute;left:40%;right:0;top:0;bottom:0;pointer-events:auto;touch-action:none}
.t-stick{position:absolute;left:0;top:25%;width:40%;bottom:0;pointer-events:auto;touch-action:none}
.t-base{position:absolute;left:18%;top:62%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);transition:opacity .2s;opacity:.55}
.t-base.on{opacity:1}
.t-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.5)}
.t-btns{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(14px + var(--safe-b));width:250px;height:240px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(10,14,24,.45);border:2px solid rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:10px;letter-spacing:.06em;display:grid;place-items:center}
.tb.down{background:color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc);transform:scale(.94)}
.tb.big{width:84px;height:84px;font-size:11px}
.tb.jump{right:0;bottom:0}.tb.swing{right:96px;bottom:22px;border-color:color-mix(in srgb,var(--acc) 70%,#fff)}
.tb.atk{right:10px;bottom:98px;width:64px;height:64px}.tb.zip{right:86px;bottom:118px;width:58px;height:58px}.tb.dash{right:176px;bottom:110px;width:54px;height:54px}.tb.act{right:188px;bottom:12px;width:54px;height:54px}
.t-top{position:absolute;right:calc(220px + var(--safe-r));top:calc(12px + var(--safe-t));display:flex;gap:10px}
.tb.sm{position:relative;width:auto;height:36px;padding:0 14px;border-radius:18px;font-size:11px}
.has-touch .hud-map{left:auto;bottom:auto;right:calc(14px + var(--safe-r));top:calc(52px + var(--safe-t));width:104px;height:104px}
.has-touch .toasts{right:auto;left:calc(18px + var(--safe-l));align-items:flex-start;top:calc(150px + var(--safe-t))}
.has-touch .iris{bottom:auto;top:calc(12px + var(--safe-t));width:min(440px,40vw);padding:8px 12px}.has-touch .iris-txt p{font-size:12px}.has-touch .iris-av{width:30px;height:30px}
.has-touch .prompt{bottom:calc(46% + var(--safe-b))}
.has-touch .hud-tr .chip.tod{display:none}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .tabs{display:none}.st-name{display:none}.status{gap:10px;font-size:12px}
  .hero{max-width:100%}
  .hero-actions .hbtn{height:46px;padding:0 18px;font-size:14px}
  .hero-desc{font-size:14px}
  .hints{display:none}
}
@media (max-height:780px){.cards{display:none}.rail{padding-bottom:38px}}
@media (max-height:560px){
  .rail{margin-top:6px;padding-bottom:24px}.tile{width:70px}
  .hero-title{font-size:clamp(34px,8vh,64px)}.hero-desc{margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hero-actions{margin-top:12px}.cards{display:none}.hero-chips{display:none}.hero-sub{font-size:14px}.hero-kicker{font-size:10px}.top{height:40px}.tile-name{display:none}.hero-actions .hbtn{height:42px}
  .tb.big{width:70px;height:70px}.t-btns{transform:scale(.88);transform-origin:right bottom}
  .hud-obj{top:calc(66px + var(--safe-t))}
  .iris{width:min(520px,56vw)}
}
@media (orientation:portrait) and (max-width:820px){
  .hero-title{font-size:clamp(44px,15vw,84px)}
  .bg-shade{background:linear-gradient(0deg,rgba(3,4,10,.98) 0%,rgba(3,4,10,.75) 45%,rgba(3,4,10,.2) 75%),linear-gradient(180deg,rgba(3,4,10,.7) 0%,rgba(3,4,10,0) 25%)}
}
</style>
